name: バグ報告
description: バグの報告はこちら
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: バグの説明
      description: できるだけ具体的に記述してください
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
      description: 本来どう動くべきか
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 実際の動作
      description: 実際に何が起きたか
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 備考
      description: スクリーンショットや補足情報があれば
    validations:
      required: false
