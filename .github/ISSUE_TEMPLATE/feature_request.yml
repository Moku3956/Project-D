name: 機能リクエスト
description: 新機能の提案はこちら
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 関連する問題
      description: どんな課題や不便があるか
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 提案する解決策
      description: どう改善したいか
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 代替案
      description: 他に検討した方法があれば
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 備考
      description: 参考資料やスクリーンショットなど
    validations:
      required: false
